<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | NovaView</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/contact.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html"
        ><span class="brand-mark">✦</span> NovaView</a
      ><button
        class="menu-toggle"
        aria-label="Toggle navigation"
        aria-expanded="false"
      >
        ☰
      </button>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a><a href="weather.html">Weather</a
        ><a href="movies.html">Movies</a><a href="about.html">About</a
        ><a class="active" href="contact.html">Contact</a>
      </nav>
    </header>
    <main class="inner-page">
      <section class="page-intro">
        <p class="eyebrow">GET IN TOUCH</p>
        <h1>Let's <span>connect.</span></h1>
        <p>
          Have a question or suggestion about this project? Use the demo form
          below.
        </p>
      </section>
      <section class="content-card contact-card">
        <form id="contact-form" class="contact-form">
          <label for="name">Your name</label
          ><input
            id="name"
            name="name"
            required
            placeholder="Enter your name"
          /><label for="email">Email address</label
          ><input
            id="email"
            name="email"
            type="email"
            required
            placeholder="you@example.com"
          /><label for="message">Message</label
          ><textarea
            id="message"
            name="message"
            rows="5"
            required
            placeholder="Write your message..."
          ></textarea
          ><button class="button button-primary" type="submit">
            Send message
          </button>
          <p id="contact-status" class="status-message" role="status">
            Demo only: this form does not send data to a server.
          </p>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <a class="brand footer-brand" href="index.html">✦ NovaView</a
      ><span>Weather and movie discovery project</span
      ><span>© <span data-year></span> NovaView</span>
    </footer>
  </body>
</html>
