<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movie Search | NovaView</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/movies.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html"
        ><span class="brand-mark">✦</span> NovaView</a
      ><button
        class="menu-toggle"
        aria-label="Toggle navigation"
        aria-expanded="false"
      >
        ☰
      </button>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a><a href="weather.html">Weather</a
        ><a class="active" href="movies.html">Movies</a
        ><a href="about.html">About</a><a href="contact.html">Contact</a>
      </nav>
    </header>
    <main class="inner-page">
      <section class="page-intro">
        <p class="eyebrow">MOVIE DISCOVERY</p>
        <h1>Find your next <span>favourite.</span></h1>
        <p>Search by title and explore films from the OMDb database.</p>
      </section>
      <section class="tool-panel">
        <form id="movie-form" class="search-form">
          <label class="sr-only" for="movie-input">Movie title</label
          ><input
            id="movie-input"
            name="movie"
            placeholder="Search a movie, e.g. Inception"
            required
          /><button class="button button-primary" type="submit">
            Search Movies
          </button>
        </form>
        <p id="movie-status" class="status-message" role="status">
          Search for a movie to see results.
        </p>
        <div id="movie-results" class="movie-grid"></div>
      </section>
    </main>
    <footer class="site-footer">
      <a class="brand footer-brand" href="index.html">✦ NovaView</a
      ><span>Weather and movie discovery project</span
      ><span>© <span data-year></span>NovaView</span>
    </footer>
  </body>
</html>
